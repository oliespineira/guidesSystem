name: CI

on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.service }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: kraal
            test_db_url: mssql://kraal_app:LocalDev_Kraal_2026@localhost:1433/kraal_test
          - service: actas
            test_db_url: mssql://actas_app:LocalDev_Actas_2026@localhost:1433/actas_test
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -r services/${{ matrix.service }}/requirements-dev.txt

      - name: Lint
        run: |
          ruff check services/${{ matrix.service }}
          ruff format --check services/${{ matrix.service }}

      - name: SCA - known vulnerabilities in the pinned Python packages (pip-audit)
        run: |
          pip install pip-audit==2.10.1
          pip-audit -r services/${{ matrix.service }}/requirements.txt

      - name: Start SQL Server and create the test databases
        run: |
          docker compose up -d --wait sqlserver
          docker compose run --rm db-init

      - name: Test with coverage (fails under 70%)
        working-directory: services/${{ matrix.service }}
        env:
          TEST_DATABASE_URL: ${{ matrix.test_db_url }}
        run: python -m pytest -q --cov=app --cov-report=term-missing --cov-fail-under=70

      - name: Build the image
        run: docker build -t ${{ matrix.service }}:ci services/${{ matrix.service }}

      - name: Image scan - HIGH or CRITICAL vulnerabilities that have a fix (Trivy)
        run: >
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.76.2
          image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --scanners vuln ${{ matrix.service }}:ci

  sast:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: SAST - Semgrep on the application code
        run: |
          pip install semgrep==1.187.0
          semgrep scan --error --metrics=off --config p/python --config p/security-audit --config p/owasp-top-ten services/kraal/app services/actas/app

  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install validators
        run: pip install check-jsonschema==0.39.0 openapi-spec-validator==0.9.0
      - name: system.yaml against system.schema.json
        run: check-jsonschema --schemafile system.schema.json system.yaml
      - name: OpenAPI documents against the OpenAPI specification
        run: |
          openapi-spec-validator services/kraal/openapi.json
          openapi-spec-validator services/actas/openapi.json
  iac:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.17.2
      - name: Terraform format and validate (no Azure access needed)
        working-directory: infra/terraform
        run: |
          terraform fmt -check
          terraform init -backend=false
          terraform validate
      - name: IaC scan (Checkov); every skip in main.tf carries its reason
        run: >
          docker run --rm -v "$PWD/infra/terraform:/tf" bridgecrew/checkov:3.4.11
          -d /tf --framework terraform --compact --quiet
  integration:
    needs: [test]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install
        run: pip install httpx==0.28.1 pytest==9.1.1
      - name: Start the whole system with compose
        run: docker compose up -d --build
      - name: Cross-seam tests against the real services
        run: python -m pytest -q integration
      - name: Show service logs if anything failed
        if: failure()
        run: docker compose logs kraal actas