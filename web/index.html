<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Guias Torrelodones</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 52rem; margin: 2rem auto; padding: 0 1rem; }
  section { border: 1px solid #ccc; border-radius: 8px; padding: 1rem; margin-bottom: 1.5rem; }
  pre { background: #f5f5f5; padding: .75rem; overflow-x: auto; }
  select, button { font-size: 1rem; margin-right: .5rem; }
</style>
</head>
<body>
<h1>Guias Torrelodones</h1>

<section>
  <h2>Roster</h2>
  <select id="ronda-roster"></select>
  <button id="btn-roster">Show roster</button>
  <pre id="out-roster"></pre>
</section>

<section>
  <h2>Year-over-year continuity</h2>
  <select id="ronda-prev"></select> &rarr; <select id="ronda-new"></select>
  <button id="btn-cont">Compare</button>
  <pre id="out-cont"></pre>
</section>

<section>
  <h2>Meetings</h2>
  <select id="ronda-meet"></select>
  <button id="btn-meet">List meetings</button>
  <ul id="meet-list"></ul>
  <pre id="out-meet"></pre>
</section>

<script>
async function api(path) {
  const res = await fetch(path);
  const body = await res.json();
  if (!res.ok) throw new Error(body.detail || res.statusText);
  return body;
}
function show(el, data) { el.textContent = JSON.stringify(data, null, 2); }
function fail(el, err) { el.textContent = "Error: " + err.message; }

async function loadRondas() {
  const rondas = await api("/api/kraal/rondas");
  for (const id of ["ronda-roster", "ronda-prev", "ronda-new", "ronda-meet"]) {
    const sel = document.getElementById(id);
    sel.replaceChildren(...rondas.map(r => new Option(r.year_label, r.id)));
  }
}

document.getElementById("btn-roster").onclick = async () => {
  const out = document.getElementById("out-roster");
  try { show(out, await api(`/api/kraal/rondas/${document.getElementById("ronda-roster").value}/roster`)); }
  catch (e) { fail(out, e); }
};

document.getElementById("btn-cont").onclick = async () => {
  const out = document.getElementById("out-cont");
  const prev = document.getElementById("ronda-prev").value;
  const nw = document.getElementById("ronda-new").value;
  try { show(out, await api(`/api/kraal/continuity?prev=${prev}&new=${nw}`)); }
  catch (e) { fail(out, e); }
};

document.getElementById("btn-meet").onclick = async () => {
  const list = document.getElementById("meet-list");
  const out = document.getElementById("out-meet");
  try {
    const meetings = await api(`/api/actas/meetings?ronda_id=${document.getElementById("ronda-meet").value}`);
    list.replaceChildren(...meetings.map(m => {
      const li = document.createElement("li");
      const b = document.createElement("button");
      b.textContent = `${m.date}: ${m.title}`;
      b.onclick = async () => show(out, await api(`/api/actas/meetings/${m.id}`));
      li.append(b);
      return li;
    }));
  } catch (e) { fail(out, e); }
};

loadRondas().catch(e => fail(document.getElementById("out-roster"), e));
</script>
</body>
</html>
