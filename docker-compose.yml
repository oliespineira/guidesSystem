services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-LocalDev_Sa_2026}
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-LocalDev_Sa_2026}
      KRAAL_DB_PASSWORD: ${KRAAL_DB_PASSWORD:-LocalDev_Kraal_2026}
      ACTAS_DB_PASSWORD: ${ACTAS_DB_PASSWORD:-LocalDev_Actas_2026}
    volumes:
      - ./db/init.sql:/init.sql:ro
    entrypoint: ["/bin/bash", "-c", "/opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -b -i /init.sql -v KRAAL_DB_PASSWORD=\"$$KRAAL_DB_PASSWORD\" ACTAS_DB_PASSWORD=\"$$ACTAS_DB_PASSWORD\""]
    restart: "no"
  
  kraal:
    build: ./services/kraal
    environment:
      DATABASE_URL: mssql://kraal_app:${KRAAL_DB_PASSWORD:-LocalDev_Kraal_2026}@sqlserver:1433/kraal
    ports:
      - "8001:8000"
    depends_on:
      db-init:
        condition: service_completed_successfully

  actas:
    build: ./services/actas
    environment:
      DATABASE_URL: mssql://actas_app:${ACTAS_DB_PASSWORD:-LocalDev_Actas_2026}@sqlserver:1433/actas
      KRAAL_URL: http://kraal:8000
    ports:
      - "8002:8000"
    depends_on:
      db-init:
        condition: service_completed_successfully

  ui:
    image: nginx:alpine
    volumes:
      - ./ui:/usr/share/nginx/html:ro
    ports:
      - "8080:80"

volumes:
  sqlserver-data: