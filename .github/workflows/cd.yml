name: CD

on:
  push:
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  images:
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [kraal, actas]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push the image tagged with the commit SHA
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: services/${{ matrix.service }}
          push: true
          provenance: false
          tags: ghcr.io/${{ github.repository_owner }}/guidessystem-${{ matrix.service }}:${{ github.sha }}

  deploy:
    needs: images
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
    outputs:
      ui_url: ${{ steps.publish.outputs.ui_url }}
      kraal_url: ${{ steps.publish.outputs.kraal_url }}
      actas_url: ${{ steps.publish.outputs.actas_url }}
    env:
      RG: ${{ vars.RESOURCE_GROUP }}
      PREFIX: ${{ vars.PREFIX }}
      UI_STORAGE: ${{ vars.UI_STORAGE }}
      REGISTRY: ghcr.io/${{ github.repository_owner }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Sign in to Azure with OIDC (no stored password)
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Remember the images running now, for a rollback
        id: previous
        run: |
          az config set extension.use_dynamic_install=yes_without_prompt
          for svc in kraal actas; do
            echo "$svc=$(az containerapp show -n "$PREFIX-$svc" -g "$RG" --query 'properties.template.containers[0].image' -o tsv)" >> "$GITHUB_OUTPUT"
          done

      - name: Deploy both services (secrets by secretref, configuration as environment variables)
        env:
          KRAAL_DB_PASSWORD: ${{ secrets.KRAAL_DB_PASSWORD }}
          ACTAS_DB_PASSWORD: ${{ secrets.ACTAS_DB_PASSWORD }}
        run: |
          SQL_HOST="$PREFIX-sql.database.windows.net"
          UI_URL=$(az storage account show -n "$UI_STORAGE" -g "$RG" --query primaryEndpoints.web -o tsv)
          UI_ORIGIN=${UI_URL%/}
          KRAAL_FQDN=$(az containerapp show -n "$PREFIX-kraal" -g "$RG" --query properties.configuration.ingress.fqdn -o tsv)
          az containerapp secret set -n "$PREFIX-kraal" -g "$RG" -o none \
            --secrets "database-url=mssql://kraal_app:${KRAAL_DB_PASSWORD}@${SQL_HOST}:1433/${PREFIX}-kraal-db?encrypt=require"
          az containerapp secret set -n "$PREFIX-actas" -g "$RG" -o none \
            --secrets "database-url=mssql://actas_app:${ACTAS_DB_PASSWORD}@${SQL_HOST}:1433/${PREFIX}-actas-db?encrypt=require"
          az containerapp update -n "$PREFIX-kraal" -g "$RG" -o none \
            --image "$REGISTRY/guidessystem-kraal:$GITHUB_SHA" \
            --set-env-vars DATABASE_URL=secretref:database-url UI_ORIGIN="$UI_ORIGIN" GIT_SHA="$GITHUB_SHA"
          az containerapp update -n "$PREFIX-actas" -g "$RG" -o none \
            --image "$REGISTRY/guidessystem-actas:$GITHUB_SHA" \
            --set-env-vars DATABASE_URL=secretref:database-url UI_ORIGIN="$UI_ORIGIN" KRAAL_URL="https://$KRAAL_FQDN" GIT_SHA="$GITHUB_SHA"

      - name: Wait until both services are healthy on this commit (cold start and database resume included)
        run: |
          for svc in kraal actas; do
            fqdn=$(az containerapp show -n "$PREFIX-$svc" -g "$RG" --query properties.configuration.ingress.fqdn -o tsv)
            for i in $(seq 1 30); do
              body=$(curl -s --max-time 30 "https://$fqdn/health" || true)
              if echo "$body" | grep -q '"status":"ok"' && echo "$body" | grep -q "\"version\":\"$GITHUB_SHA\""; then
                echo "$svc is healthy: $body"; break
              fi
              if [ "$i" = 30 ]; then echo "$svc never became healthy on $GITHUB_SHA (last answer: $body)"; exit 1; fi
              echo "waiting for $svc ($i/30): $body"; sleep 10
            done
          done

      - name: Publish the UI with the services' addresses
        id: publish
        run: |
          KRAAL_FQDN=$(az containerapp show -n "$PREFIX-kraal" -g "$RG" --query properties.configuration.ingress.fqdn -o tsv)
          ACTAS_FQDN=$(az containerapp show -n "$PREFIX-actas" -g "$RG" --query properties.configuration.ingress.fqdn -o tsv)
          UI_URL=$(az storage account show -n "$UI_STORAGE" -g "$RG" --query primaryEndpoints.web -o tsv)
          printf 'window.CONFIG = {\n  KRAAL_URL: "https://%s",\n  ACTAS_URL: "https://%s",\n};\n' "$KRAAL_FQDN" "$ACTAS_FQDN" > ui/config.js
          cat ui/config.js
          az storage blob upload-batch --account-name "$UI_STORAGE" --destination '$web' --source ui --overwrite --auth-mode key -o none
          echo "ui_url=$UI_URL" >> "$GITHUB_OUTPUT"
          echo "kraal_url=https://$KRAAL_FQDN" >> "$GITHUB_OUTPUT"
          echo "actas_url=https://$ACTAS_FQDN" >> "$GITHUB_OUTPUT"

      - name: Roll back to the previous images if the deploy failed
        if: failure() && steps.previous.outcome == 'success'
        run: |
          az containerapp update -n "$PREFIX-kraal" -g "$RG" --image "${{ steps.previous.outputs.kraal }}" -o none
          az containerapp update -n "$PREFIX-actas" -g "$RG" --image "${{ steps.previous.outputs.actas }}" -o none
          echo "Rolled back to the previous images."

  dast:
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: DAST - ZAP baseline scan of the live UI
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: ${{ needs.deploy.outputs.ui_url }}
          fail_action: false
          allow_issue_writing: false
          artifact_name: zap-ui
      - name: DAST - ZAP baseline scan of the kraal API
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: ${{ needs.deploy.outputs.kraal_url }}/docs
          fail_action: false
          allow_issue_writing: false
          artifact_name: zap-kraal
      - name: DAST - ZAP baseline scan of the actas API
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: ${{ needs.deploy.outputs.actas_url }}/docs
          fail_action: false
          allow_issue_writing: false
          artifact_name: zap-actas