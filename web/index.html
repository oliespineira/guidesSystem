<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Guias Torrelodones</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 52rem; margin: 2rem auto; padding: 0 1rem; }
  section { border: 1px solid #ccc; border-radius: 8px; padding: 1rem; margin-bottom: 1.5rem; }
  pre { background: #f5f5f5; padding: .75rem; overflow-x: auto; }
  select, button { font-size: 1rem; margin-right: .5rem; }
</style>
</head>
<body>
<h1>Guias Torrelodones</h1>

<section>
  <h2>Roster</h2>
  <select id="ronda-roster"></select>
  <button id="btn-roster">Show roster</button>
  <pre id="out-roster"></pre>
</section>

<section>
  <h2>Year-over-year continuity</h2>
  <select id="ronda-prev"></select> &rarr; <select id="ronda-new"></select>
  <button id="btn-cont">Compare</button>
  <pre id="out-cont"></pre>
</section>

<section>
  <h2>Meetings</h2>
  <select id="ronda-meet"></select>
  <button id="btn-meet">List meetings</button>
  <ul id="meet-list"></ul>
  <pre id="out-meet"></pre>
</section>

<section>
  <h2>Avisos (live notices)</h2>
  <p>
    <select id="ronda-avisos"></select>
    <select id="vol-avisos"></select>
    <button id="btn-connect">Connect as this volunteer</button>
  </p>
  <p id="avisos-status">Not connected.</p>
  <ul id="avisos-list"></ul>
  <h3>Post a notice</h3>
  <p>
    <select id="aviso-audience">
      <option value="all">Whole kraal</option>
      <option value="rama">One rama</option>
      <option value="role">One role</option>
    </select>
    <input id="aviso-target" placeholder="Rama or role name (e.g. Guías, Tesorera)">
  </p>
  <p><input id="aviso-title" placeholder="Title" size="40"></p>
  <p><textarea id="aviso-body" placeholder="Details (optional)" rows="2" cols="40"></textarea></p>
  <button id="btn-post">Send notice</button>
  <pre id="out-aviso"></pre>
</section>

<script>
async function api(path) {
  const res = await fetch(path);
  const body = await res.json();
  if (!res.ok) throw new Error(body.detail || res.statusText);
  return body;
}
function show(el, data) { el.textContent = JSON.stringify(data, null, 2); }
function fail(el, err) { el.textContent = "Error: " + err.message; }

async function loadRondas() {
  const rondas = await api("/api/kraal/rondas");
  for (const id of ["ronda-roster", "ronda-prev", "ronda-new", "ronda-meet", "ronda-avisos"]) {
    const sel = document.getElementById(id);
    sel.replaceChildren(...rondas.map(r => new Option(r.year_label, r.id)));
  }
}

document.getElementById("btn-roster").onclick = async () => {
  const out = document.getElementById("out-roster");
  try { show(out, await api(`/api/kraal/rondas/${document.getElementById("ronda-roster").value}/roster`)); }
  catch (e) { fail(out, e); }
};

document.getElementById("btn-cont").onclick = async () => {
  const out = document.getElementById("out-cont");
  const prev = document.getElementById("ronda-prev").value;
  const nw = document.getElementById("ronda-new").value;
  try { show(out, await api(`/api/kraal/continuity?prev=${prev}&new=${nw}`)); }
  catch (e) { fail(out, e); }
};

document.getElementById("btn-meet").onclick = async () => {
  const list = document.getElementById("meet-list");
  const out = document.getElementById("out-meet");
  try {
    const meetings = await api(`/api/actas/meetings?ronda_id=${document.getElementById("ronda-meet").value}`);
    list.replaceChildren(...meetings.map(m => {
      const li = document.createElement("li");
      const b = document.createElement("button");
      b.textContent = `${m.date}: ${m.title}`;
      b.onclick = async () => show(out, await api(`/api/actas/meetings/${m.id}`));
      li.append(b);
      return li;
    }));
  } catch (e) { fail(out, e); }
};

loadRondas().catch(e => fail(document.getElementById("out-roster"), e));



// ----- Avisos: live notices over Server-Sent Events -----
let source = null;   // the open EventSource, if any

async function loadVolunteers() {
  const vols = await api("/api/kraal/volunteers");
  document.getElementById("vol-avisos").replaceChildren(...vols.map(v => new Option(v.name, v.id)));
}

function addNotice(n) {
  const li = document.createElement("li");
  const strong = document.createElement("strong");
  strong.textContent = n.title;
  const meta = document.createElement("small");
  meta.textContent = ` (${n.topic}, ${n.created_at})`;
  li.append(strong, meta);
  if (n.body) { const p = document.createElement("div"); p.textContent = n.body; li.append(p); }
  document.getElementById("avisos-list").prepend(li);     // newest on top
}

document.getElementById("btn-connect").onclick = async () => {
  const ronda = document.getElementById("ronda-avisos").value;
  const vol = document.getElementById("vol-avisos");
  const status = document.getElementById("avisos-status");
  if (source) source.close();                                // switching person: close the old stream
  document.getElementById("avisos-list").replaceChildren();
  try {
    const topics = await api(`/api/avisos/topics?ronda_id=${ronda}&volunteer_id=${vol.value}`);
    status.textContent = `Connected as ${vol.selectedOptions[0].text}. Listening to: ${topics.join(", ")}`;
  } catch (e) { fail(status, e); return; }
  source = new EventSource(`/api/avisos/stream?ronda_id=${ronda}&volunteer_id=${vol.value}`);
  source.addEventListener("notice", e => addNotice(JSON.parse(e.data)));
  source.onerror = () => { status.textContent = "Connection lost, reconnecting..."; };
};

document.getElementById("btn-post").onclick = async () => {
  const out = document.getElementById("out-aviso");
  const payload = {
    ronda_id: Number(document.getElementById("ronda-avisos").value),
    audience: document.getElementById("aviso-audience").value,
    target: document.getElementById("aviso-target").value || null,
    title: document.getElementById("aviso-title").value,
    body: document.getElementById("aviso-body").value || null,
  };
  try {
    const res = await fetch("/api/avisos", {
      method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(payload),
    });
    const body = await res.json();
    if (!res.ok) throw new Error(typeof body.detail === "string" ? body.detail : JSON.stringify(body.detail));
    show(out, body);
  } catch (e) { fail(out, e); }
};

loadVolunteers().catch(e => fail(document.getElementById("avisos-status"), e));

</script>
</body>
</html>
